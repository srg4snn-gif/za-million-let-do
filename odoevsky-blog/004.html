    <script>
        (() => {
            const article = document.querySelector('[data-debate-text]');
            const files = ['004-1.txt', '004-2.txt', '004-3.txt', '004-4.txt', '004-5.txt'];

            Promise.all(files.map((file) => fetch(file, { cache: 'no-cache' }).then((response) => {
                if (!response.ok) {
                    throw new Error(`Failed to load ${file}`);
                }
                return response.text();
            })))
                .then((parts) => {
                    const paragraphs = parts.join('\n\n').trim().split(/\n\s*\n/);
                    article.innerHTML = '';

                    paragraphs.forEach((text, index) => {
                        if (text === 'ДЕБАТЫ') {
                            const heading = document.createElement('h2');
                            heading.textContent = text;
                            article.appendChild(heading);
                            return;
                        }

                        const paragraph = document.createElement('p');
                        paragraph.textContent = text;

                        if (text === 'Невзоров vs Любарский') {
                            const strong = document.createElement('strong');
                            strong.textContent = text;
                            paragraph.textContent = '';
                            paragraph.appendChild(strong);
                        }

                        if (index === paragraphs.length - 1) {
                            paragraph.style.color = '#999';
                        }

                        article.appendChild(paragraph);
                    });
                })
                .catch(() => {
                    article.innerHTML = '<p>Не удалось загрузить текст.</p>';
                });
        })();
    </script>
