<style>
.comments-page {
    max-width: 800px;
    margin: auto;
    padding: 40px 20px;
}

.comments-page h1 {
    margin-bottom: 30px;
}

.comments-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 46px;
}

.comments-form label {
    color: #ddd;
}

.comments-form input:not([type="checkbox"]),
.comments-form textarea {
    padding: 11px 12px;
    background: #111;
    border: 1px solid #444;
    color: #fff;
    font: inherit;
}

.comments-form textarea {
    min-height: 140px;
    resize: vertical;
}

.comments-form button {
    align-self: flex-start;
    padding: 11px 18px;
    background: #333;
    color: #fff;
    border: 0;
    cursor: pointer;
    font: inherit;
}

.comments-form button:hover {
    background: #555;
}

.comments-form button:disabled {
    cursor: wait;
    opacity: 0.65;
}

.comments-form .hidden-field {
    display: none;
}

.privacy-consent {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    line-height: 1.45;
}

.privacy-consent input {
    flex: 0 0 auto;
    margin-top: 0.25em;
}

.privacy-consent a {
    color: #d6bc7e;
}

.comment-status,
.comment-note {
    color: #aaa;
    font-size: 0.9rem;
    line-height: 1.5;
}

.comment-status {
    min-height: 1.35em;
    color: #d6bc7e;
}

.comment-list-block {
    border-top: 1px solid #333;
    padding-top: 24px;
}

.comment-list-block h2 {
    margin: 0 0 22px;
}

.comment-date-group {
    margin-top: 26px;
}

.comment-date {
    margin: 0 0 14px;
    color: #d6bc7e;
    font-size: 1rem;
    font-weight: normal;
}

.comment-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin: 0;
    padding: 0;
    list-style: none;
}

.comment-item {
    border-top: 1px solid #252525;
    padding-top: 16px;
}

.comment-item:first-child {
    border-top: 0;
    padding-top: 0;
}

.comment-meta {
    margin: 0 0 8px;
    color: #aaa;
    font-size: 0.9rem;
}

.comment-author {
    color: #fff;
    font-weight: bold;
}

.comment-text {
    margin: 0;
    line-height: 1.6;
    white-space: pre-wrap;
}

.reply-context {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    color: #d6bc7e;
    font-size: 0.9rem;
}

.reply-context.is-hidden {
    display: none;
}

.comments-form .reply-cancel,
.comment-reply-button {
    margin-top: 10px;
    padding: 6px 10px;
    background: #333;
    color: #fff;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 0.85rem;
}

.comments-form .reply-cancel:hover,
.comment-reply-button:hover {
    background: #555;
}

.comment-actions {
    margin-top: 10px;
}

.comment-replies {
    margin: 16px 0 0 18px;
    padding: 0 0 0 16px;
    border-left: 1px solid #333;
    list-style: none;
}

.comment-replies .comment-item {
    border-top: 1px solid #252525;
    padding-top: 14px;
}
</style>
</head>

<body>
    <header class="top-nav" data-shared-menu></header>

    <main class="comments-page">
        <h1>Комментарии</h1>

        <form class="comments-form" id="commentForm">
            <label for="commentUsername">Имя или псевдоним</label>
            <input id="commentUsername" type="text" name="username" autocomplete="nickname" maxlength="80" required>

            <label for="commentEmail">Email</label>
            <input id="commentEmail" type="email" name="email" autocomplete="email" maxlength="254" aria-describedby="commentEmailNote" required>
            <p class="comment-note" id="commentEmailNote">Email нужен для модерации и возможной связи с автором. На сайте он не публикуется.</p>

            <label for="commentText">Комментарий</label>
            <textarea id="commentText" name="comment" maxlength="5000" required></textarea>

            <label class="hidden-field" for="commentWebsite" aria-hidden="true">Website</label>
            <input class="hidden-field" id="commentWebsite" type="text" name="website" autocomplete="off" tabindex="-1" aria-hidden="true">

            <p class="reply-context is-hidden" id="replyContext">
                <span id="replyContextText"></span>
                <button class="reply-cancel" id="replyCancel" type="button">Отменить</button>
            </p>

            <label class="privacy-consent" for="privacyConsent">
                <input id="privacyConsent" type="checkbox" required>
                <span>Я согласен на обработку имени, email и текста комментария для модерации и публикации согласно <a href="datenschutz.html">Datenschutzerklärung</a>.</span>
            </label>

            <button type="submit">Отправить комментарий</button>
            <p class="comment-status" id="commentStatus" aria-live="polite"></p>
            <p class="comment-note">Комментарий появится на странице только после проверки. Опубликованы будут имя или псевдоним, текст и время отправки.</p>
        </form>

        <section class="comment-list-block" aria-labelledby="commentListTitle">
            <h2 id="commentListTitle">Комментарии читателей</h2>
            <div id="commentsList"></div>
        </section>
    </main>

    <footer class="site-footer">
        <a href="impressum.html">Impressum</a>
        <span>|</span>
        <a href="datenschutz.html">Datenschutz</a>
    </footer>

    <script src="shared-menu.js"></script>
    <script>
        (function () {
            const SUPABASE_URL = 'https://jlkqomamjnwgxcapkvnn.supabase.co';
            const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_8XPOAtjGTKY0k-BprVux9g_wua4mwlE';
            const COMMENTS_ENDPOINT = SUPABASE_URL + '/rest/v1/comments';

            const form = document.getElementById('commentForm');
            const usernameInput = document.getElementById('commentUsername');
            const emailInput = document.getElementById('commentEmail');
            const textInput = document.getElementById('commentText');
            const websiteInput = document.getElementById('commentWebsite');
            const submitButton = form.querySelector('button[type="submit"]');
            const replyContext = document.getElementById('replyContext');
            const replyContextText = document.getElementById('replyContextText');
            const replyCancel = document.getElementById('replyCancel');
            const status = document.getElementById('commentStatus');
            const commentsList = document.getElementById('commentsList');
            let replyParentId = null;

            const dateFormatter = new Intl.DateTimeFormat('ru-RU', {
                day: '2-digit',
                month: 'long',
                year: 'numeric'
            });
            const dateTimeFormatter = new Intl.DateTimeFormat('ru-RU', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            function appendText(parent, text) {
                parent.appendChild(document.createTextNode(text));
            }

            function formatCommentDate(createdAt) {
                const date = new Date(createdAt);
                return Number.isNaN(date.getTime())
                    ? ''
                    : dateTimeFormatter.format(date);
            }

            function getCommentDateKey(createdAt) {
                const date = new Date(createdAt);
                if (Number.isNaN(date.getTime())) {
                    return '0000-00-00';
                }

                const year = String(date.getFullYear());
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return year + '-' + month + '-' + day;
            }

            function formatCommentDay(createdAt) {
                const date = new Date(createdAt);
                return Number.isNaN(date.getTime())
                    ? 'Без даты'
                    : dateFormatter.format(date);
            }

            function resetReplyMode() {
                replyParentId = null;
                replyContext.classList.add('is-hidden');
                replyContextText.textContent = '';
                submitButton.textContent = 'Отправить комментарий';
            }

            function startReply(comment) {
                replyParentId = comment.id;
                replyContextText.textContent = 'Ответ на комментарий ' + comment.username;
                replyContext.classList.remove('is-hidden');
                submitButton.textContent = 'Отправить ответ';
                textInput.focus();
            }

            function buildCommentTree(comments) {
                const byId = new Map();
                const roots = [];

                comments.forEach((comment) => {
                    byId.set(comment.id, Object.assign({}, comment, { replies: [] }));
                });

                byId.forEach((comment) => {
                    if (comment.parent_id && byId.has(comment.parent_id)) {
                        byId.get(comment.parent_id).replies.push(comment);
                    } else {
                        roots.push(comment);
                    }
                });

                byId.forEach((comment) => {
                    comment.replies.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                });
                roots.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                return roots;
            }

            function createCommentItem(comment) {
                const item = document.createElement('li');
                item.className = 'comment-item';

                const meta = document.createElement('p');
                meta.className = 'comment-meta';

                const author = document.createElement('span');
                author.className = 'comment-author';
                appendText(author, comment.username);
                meta.appendChild(author);
                appendText(meta, ' · ' + formatCommentDate(comment.created_at));

                const text = document.createElement('p');
                text.className = 'comment-text';
                appendText(text, comment.comment);

                const replyButton = document.createElement('button');
                replyButton.className = 'comment-reply-button';
                replyButton.type = 'button';
                appendText(replyButton, 'Ответить');
                replyButton.addEventListener('click', function () {
                    startReply(comment);
                });

                item.appendChild(meta);
                item.appendChild(text);
                item.appendChild(replyButton);

                if (comment.replies.length > 0) {
                    const replies = document.createElement('ul');
                    replies.className = 'comment-replies';
                    comment.replies.forEach((reply) => {
                        replies.appendChild(createCommentItem(reply));
                    });
                    item.appendChild(replies);
                }

                return item;
            }

            function renderComments(comments) {
                commentsList.innerHTML = '';

                if (comments.length === 0) {
                    const empty = document.createElement('p');
                    empty.className = 'comment-note';
                    appendText(empty, 'Пока комментариев нет.');
                    commentsList.appendChild(empty);
                    return;
                }

                const tree = buildCommentTree(comments);
                const groups = new Map();

                tree.forEach((comment) => {
                    const dateKey = getCommentDateKey(comment.created_at);
                    if (!groups.has(dateKey)) {
                        groups.set(dateKey, {
                            label: formatCommentDay(comment.created_at),
                            comments: []
                        });
                    }
                    groups.get(dateKey).comments.push(comment);
                });

                Array.from(groups.entries())
                    .sort((a, b) => b[0].localeCompare(a[0]))
                    .forEach(([, groupData]) => {
                        const group = document.createElement('div');
                        group.className = 'comment-date-group';

                        const heading = document.createElement('h3');
                        heading.className = 'comment-date';
                        appendText(heading, groupData.label);
                        group.appendChild(heading);

                        const list = document.createElement('ul');
                        list.className = 'comment-list';

                        groupData.comments.forEach((comment) => {
                            list.appendChild(createCommentItem(comment));
                        });

                        group.appendChild(list);
                        commentsList.appendChild(group);
                    });
            }

            async function loadComments() {
                try {
                    const query = '?select=id,parent_id,username,comment,created_at'
                        + '&approved=eq.true'
                        + '&order=created_at.desc';

                    const response = await fetch(COMMENTS_ENDPOINT + query, {
                        headers: {
                            apikey: SUPABASE_PUBLISHABLE_KEY
                        }
                    });

                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }

                    const comments = await response.json();
                    renderComments(Array.isArray(comments) ? comments : []);
                } catch (error) {
                    commentsList.innerHTML = '';
                    const message = document.createElement('p');
                    message.className = 'comment-note';
                    appendText(message, 'Не удалось загрузить комментарии. Попробуйте обновить страницу позже.');
                    commentsList.appendChild(message);
                }
            }

            form.addEventListener('submit', async function (event) {
                event.preventDefault();

                const username = usernameInput.value.trim();
                const email = emailInput.value.trim();
                const text = textInput.value.trim();

                if (!username || !email || !text || !form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                if (websiteInput.value.trim()) {
                    form.reset();
                    resetReplyMode();
                    status.textContent = 'Комментарий отправлен и появится после проверки.';
                    return;
                }

                submitButton.disabled = true;
                status.textContent = 'Отправляем комментарий...';

                try {
                    const response = await fetch(COMMENTS_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            apikey: SUPABASE_PUBLISHABLE_KEY,
                            'Content-Type': 'application/json',
                            Prefer: 'return=minimal'
                        },
                        body: JSON.stringify({
                            username: username,
                            email: email,
                            comment: text,
                            parent_id: replyParentId,
                            created_at: new Date().toISOString(),
                            approved: false
                        })
                    });

                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }

                    form.reset();
                    resetReplyMode();
                    usernameInput.focus();
                    status.textContent = 'Комментарий отправлен и появится после проверки.';
                } catch (error) {
                    status.textContent = 'Не удалось отправить комментарий. Попробуйте ещё раз.';
                } finally {
                    submitButton.disabled = false;
                }
            });

            replyCancel.addEventListener('click', resetReplyMode);
            loadComments();
        }());
    </script>
</body>
</html>
