name: Finish publication 008 once

on:
  push:
    branches:
      - finish-publish-008-20260703

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish-publish-008-20260703
          fetch-depth: 0

      - name: Update sitemaps and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          html_path = Path('sitemap.html')
          html = html_path.read_text(encoding='utf-8')
          line = '                <li><a href="odoevsky-blog/008.html">Мальчик</a></li>'
          if line not in html:
              anchor = '                <li><a href="odoevsky-blog/007.html">Окончание этюда, написанное четырьмя Искинами по их разумению</a></li>'
              if anchor not in html:
                  raise SystemExit('sitemap.html anchor not found')
              html = html.replace(anchor, anchor + '\n' + line, 1)
              html_path.write_text(html, encoding='utf-8')

          xml_path = Path('sitemap.xml')
          xml = xml_path.read_text(encoding='utf-8')
          xml = xml.replace(
              '<loc>https://srg4snn-gif.github.io/za-million-let-do/odoevsky-blog/</loc>\n    <lastmod>2026-06-29</lastmod>',
              '<loc>https://srg4snn-gif.github.io/za-million-let-do/odoevsky-blog/</loc>\n    <lastmod>2026-07-03</lastmod>',
              1,
          )
          if 'odoevsky-blog/008.html' not in xml:
              anchor = '''  <url>
    <loc>https://srg4snn-gif.github.io/za-million-let-do/odoevsky-blog/007.html</loc>
    <lastmod>2026-06-29</lastmod>
  </url>'''
              addition = anchor + '''
  <url>
    <loc>https://srg4snn-gif.github.io/za-million-let-do/odoevsky-blog/008.html</loc>
    <lastmod>2026-07-03</lastmod>
  </url>'''
              if anchor not in xml:
                  raise SystemExit('sitemap.xml anchor not found')
              xml = xml.replace(anchor, addition, 1)
          xml = xml.replace(
              '<loc>https://srg4snn-gif.github.io/za-million-let-do/sitemap.html</loc>\n    <lastmod>2026-07-01</lastmod>',
              '<loc>https://srg4snn-gif.github.io/za-million-let-do/sitemap.html</loc>\n    <lastmod>2026-07-03</lastmod>',
              1,
          )
          xml_path.write_text(xml, encoding='utf-8')

          posts = json.loads(Path('odoevsky-blog/posts.json').read_text(encoding='utf-8'))
          matches = [p for p in posts if p.get('id') == '008' and p.get('path') == '008.html' and p.get('published') is True]
          if len(matches) != 1:
              raise SystemExit('posts.json validation failed')

          post = Path('odoevsky-blog/008.html').read_text(encoding='utf-8')
          for required in (
              '<h1>Мальчик</h1>',
              'data-comment-scope="/odoevsky-blog/008.html"',
              '<link rel="canonical" href="https://srg4snn-gif.github.io/za-million-let-do/odoevsky-blog/008.html">',
              '<script src="../shared-menu.js"></script>',
              '<script src="../odoevsky-blog-comments.js"></script>',
          ):
              if required not in post:
                  raise SystemExit('008.html validation failed: ' + required)

          ET.parse(xml_path)
          PY

      - name: Commit result and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/finish-publish-008-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.html sitemap.xml .github/workflows/finish-publish-008-once.yml
          git commit -m "Заметка «Мальчик» добавлена в карты сайта"
          git push origin HEAD:finish-publish-008-20260703
